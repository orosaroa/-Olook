<style>
:root{
  --bg:#FAF4E8; --ink:#54554D; --ink-strong:#3A3B34; --muted:#8C877A;
  --pill:#54554D; --pill-text:#FAF4E8; --accent:#54554D; --line:#E4DCCC;
  --card:#FFFDF8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14323A; --ink:#EFE7D8; --ink-strong:#FAF4E8; --muted:#9FB8AF;
    --pill:#205048; --pill-text:#F3ECDD; --accent:#E4C89A; --line:#2A4B45;
    --card:#193B41;
  }
}
:root[data-theme="dark"]{
  --bg:#14323A; --ink:#EFE7D8; --ink-strong:#FAF4E8; --muted:#9FB8AF;
  --pill:#205048; --pill-text:#F3ECDD; --accent:#E4C89A; --line:#2A4B45;
  --card:#193B41;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;}
body{
  font-family:'Amiri', serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.en{font-family:'Cormorant Garamond', serif;}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 40px;}
header{text-align:center;padding:28px 18px 10px;}
.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;box-shadow:0 4px 18px rgba(0,0,0,.18);}
h1{font-size:26px;margin:14px 0 2px;color:var(--ink-strong);letter-spacing:.5px;}
h1 .en{font-size:17px;display:block;font-style:italic;color:var(--muted);margin-top:2px;}
.tag{font-size:13px;color:var(--muted);margin:2px 0 10px;}
.loc a{color:var(--muted);font-size:12.5px;text-decoration:none;border-bottom:1px dotted var(--muted);}
.social{display:flex;gap:14px;justify-content:center;margin:12px 0 4px;font-size:12.5px;}
.social a{color:var(--ink);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:20px;}
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;}
.searchbar input{
  width:100%;padding:11px 16px;border-radius:24px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-strong);font-family:'Cormorant Garamond',serif;font-size:16px;outline:none;
}
nav{position:sticky;top:56px;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ink);
  padding:7px 14px;border-radius:18px;font-family:'Cormorant Garamond',serif;font-size:14px;cursor:pointer;white-space:nowrap;
}
nav button.active{background:var(--pill);color:var(--pill-text);border-color:var(--pill);}
section.cat{margin-top:22px;}
.catbar{
  background:var(--pill);color:var(--pill-text);border-radius:22px;padding:10px 18px;
  display:flex;justify-content:space-between;align-items:center;
}
.catbar .en{font-size:15px;letter-spacing:.5px;}
.catbar .ar{font-size:17px;font-weight:700;}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line);gap:10px;}
.item:last-child{border-bottom:none;}
.names{text-align:right;flex:1;}
.names .ar{font-size:16.5px;font-weight:700;color:var(--ink-strong);line-height:1.5;}
.names .en{font-size:13.5px;color:var(--muted);font-style:italic;}
.price{text-align:left;min-width:74px;}
.price .amt{font-size:16px;font-weight:700;color:var(--accent);}
.price .cal{display:block;font-size:11.5px;color:var(--muted);font-family:'Cormorant Garamond',serif;margin-top:2px;}
.price .sizeline{font-size:11px;color:var(--muted);display:block;}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;display:none;}
footer{text-align:center;margin-top:36px;font-size:12px;color:var(--muted);}
</style>
</head>

<script>

const MENU = [
{cat:"espresso", ar:"مشروبات الإسبريسو", en:"Espresso Drinks", items:[
["إسبريسو","Espresso","12","2"],
["أمريكانو","Americano","14","2"],
["إسبريسو مكياتو","Espresso Macchiato","13","10"],
["كورتادو","Cortado","14","51"],
["فلات وايت","Flat White","15","65"],
["كابتشينو","Cappuccino","16","110"],
["لاتيه","Latte","16","130"],
["سبانش لاتيه","Spanish Latte","18","215"],
]},
{cat:"filter", ar:"مشروبات التقطير", en:"Filter Drinks", items:[
["قهوة اليوم (حار)","Coffee of the Day (Hot)","S 10 | M 12 | L 15","2"],
["قهوة اليوم (بارد)","Coffee of the Day (Cold)","M 12 | L 16","2"],
["آيس دريب","Ice Drip","20","3"],
["في60 حار","V60 Hot","18","3"],
["بوكس قهوة اليوم حار","Box Coffee of the Day (Hot)","42","8"],
["بوكس قهوة اليوم بارد","Box Coffee of the Day (Cold)","53","8"],
]},
{cat:"cold", ar:"المشروبات الباردة", en:"Cold Drinks", items:[
["إسبريسو فريدو","Espresso Freddo","15","5"],
["آيس أمريكانو","Iced Americano","16","3"],
["فريدو كابتشينو","Freddo Cappuccino","22","220"],
["آيس لاتيه","Iced Latte","18","205"],
["آيس سبانش لاتيه","Iced Spanish Latte","20","250"],
["كركديه","Iced Karkade","20","180"],
["عصير برتقال","Orange Juice","15","150"],
["آيس تي توت","Ice Tea Berries","18","150"],
["آيس تي خوخ","Ice Tea Peach","18","150"],
]},
{cat:"matcha", ar:"ماتشا", en:"Matcha", items:[
["آيس ماتشا لاتيه","Iced Matcha Latte","20","180"],
["آيس كلاود ماتشا (مستيكا)","Iced Cloud Matcha (Mistika)","22","150"],
["سكاي بلو ماتشا","Sky Blue Matcha","24","300"],
]},
{cat:"other", ar:"مشروبات أخرى", en:"Other Drinks", items:[
["شاي","Tea","7","3"],
["ماء","Water","1","0"],
["مياه غازية","Sparkling Water","5","0"],
]},
{cat:"flatbread", ar:"فلات بريد", en:"Flat Bread", items:[
["فلات بريد حلومي","Flat Bread Halloumi","20",""],
["فلات بريد مارغريتا","Flat Bread Margherita","18",""],
["فلات بريد تيركي","Flat Bread Turkey","18",""],
["فلات بريد شكشوكة","Flat Bread Shakshoka","17",""],
["فلات بريد لبنة بالعسل","Flat Bread Labneh & Honey","15",""],
["فلات بريد أجبان","Flat Bread Cheese","16",""],
]},
{cat:"desserts", ar:"الحلويات", en:"Desserts", items:[
["كيكة فستق بالتيراميسو","Pistachio Tiramisu Cake","22","450"],
["براونيز","Brownies","15","280"],
["كيكة البيكان","Pecan Cake","20","420"],
["تشيز كيك كراميل","Caramel Cheesecake","23","550"],
["كوكيز","Cookies","13","230"],
]},
{cat:"extras", ar:"إضافات", en:"Extras", items:[
["إضافة شوت إسبريسو","Add Espresso Shot","4",""],
["حليب قليل الدسم","Low-fat Milk","2",""],
["حليب جوز هند","Coconut Milk","4",""],
["حليب فانيليا","Vanilla Milk","4",""],
["حليب شوفان","Oat Milk","4",""],
]},
];

const menuEl = document.getElementById('menu');
const navEl = document.getElementById('nav');
const q = document.getElementById('q');
const emptyEl = document.getElementById('empty');

function priceHTML(p){
  if(p.includes('|')){
    return p.split('|').map(s=>'<span class="sizeline">'+s.trim()+'</span>').join('');
  }
  return '<span class="amt">'+p+' ر.س</span>';
}

function render(filter){
  menuEl.innerHTML = '';
  let anyVisible = false;
  MENU.forEach(cat=>{
    const items = filter ? cat.items.filter(it => it[0].includes(filter) || it[1].toLowerCase().includes(filter.toLowerCase())) : cat.items;
    if(items.length===0) return;
    anyVisible = true;
    const sec = document.createElement('section');
    sec.className='cat'; sec.id='cat-'+cat.cat;
    let rows = items.map(it=>{
      const calHTML = it[3] ? '<span class="cal">'+it[3]+' cal</span>' : '';
      return '<div class="item"><div class="names"><div class="ar">'+it[0]+'</div><div class="en">'+it[1]+'</div></div><div class="price">'+priceHTML(it[2])+calHTML+'</div></div>';
    }).join('');
    sec.innerHTML = '<div class="catbar"><span class="en">'+cat.en+'</span><span class="ar">'+cat.ar+'</span></div>'+rows;
    menuEl.appendChild(sec);
  });
  emptyEl.style.display = anyVisible ? 'none' : 'block';
}

function buildNav(){
  navEl.innerHTML = MENU.map(c=>'<button data-cat="'+c.cat+'">'+c.ar+'</button>').join('');
  navEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      const el = document.getElementById('cat-'+b.dataset.cat);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

q.addEventListener('input', e => render(e.target.value.trim()));

buildNav();
render('');
</script>
